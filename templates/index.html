<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>

        <a href="/add" class="btn">+ Add Student</a>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>

                {% for student in students %}

                <tr>
                    <td>{{ student.id }}</td>
                    <td>{{ student.name }}</td>
                    <td>{{ student.email }}</td>
                    <td>{{ student.course }}</td>

                    <td>
                        <a
                            href="/delete/{{ student.id }}"
                            class="delete"
                            onclick="return confirm('Delete this student?')"
                        >
                            Delete
                        </a>
                    </td>
                </tr>

                {% else %}

                <tr>
                    <td colspan="5">
                        No students found.
                    </td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</body>
</html>
