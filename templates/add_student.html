<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Student</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="form-container">

        <h1>Add Student</h1>

        <form method="POST">

            <label>Student Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter student name"
                required
            >

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter email"
                required
            >

            <label>Course</label>

            <input
                type="text"
                name="course"
                placeholder="Enter course"
                required
            >

            <button type="submit">
                Add Student
            </button>

        </form>

        <a href="/" class="back">
            ← Back to Students
        </a>

    </div>

</body>

</html>
